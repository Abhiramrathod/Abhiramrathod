<svg width="980" height="320" viewBox="0 0 980 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated GitHub control room</title>
  <desc id="desc">A neon 3D-style dashboard with animated telemetry bars, orbit lines, and contribution blocks.</desc>
  <style>
    .glow-cyan { filter: drop-shadow(0 0 10px #00d4ff) drop-shadow(0 0 22px rgba(0,212,255,.45)); }
    .glow-amber { filter: drop-shadow(0 0 10px #ffb000) drop-shadow(0 0 20px rgba(255,176,0,.35)); }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .float { animation: float 5.5s ease-in-out infinite; }
    .float2 { animation: float 6.8s ease-in-out infinite reverse; }
    .scan { animation: scan 4s linear infinite; }
    .dash { stroke-dasharray: 12 18; animation: dash 8s linear infinite; }
    .bar1 { animation: bar 2.2s ease-in-out infinite; transform-origin: bottom; transform-box: fill-box; }
    .bar2 { animation: bar 2.7s ease-in-out infinite .2s; transform-origin: bottom; transform-box: fill-box; }
    .bar3 { animation: bar 2.4s ease-in-out infinite .4s; transform-origin: bottom; transform-box: fill-box; }
    .bar4 { animation: bar 3.1s ease-in-out infinite .1s; transform-origin: bottom; transform-box: fill-box; }
    .tile { animation: tile 3.6s ease-in-out infinite; }
    .tile:nth-of-type(2n) { animation-delay: .35s; }
    .tile:nth-of-type(3n) { animation-delay: .7s; }
    .orbit { transform-origin: 490px 164px; animation: rotate 18s linear infinite; }
    .orbit2 { transform-origin: 490px 164px; animation: rotate 25s linear infinite reverse; }
    @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes scan { from { transform: translateY(-42px); } to { transform: translateY(330px); } }
    @keyframes dash { to { stroke-dashoffset: -240; } }
    @keyframes bar { 0%,100% { transform: scaleY(.45); opacity: .65; } 50% { transform: scaleY(1); opacity: 1; } }
    @keyframes tile { 0%,100% { opacity: .34; } 50% { opacity: 1; } }
    @keyframes rotate { to { transform: rotate(360deg); } }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="980" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05070a"/>
      <stop offset=".45" stop-color="#071014"/>
      <stop offset="1" stop-color="#101000"/>
    </linearGradient>
    <linearGradient id="panel" x1="150" y1="58" x2="850" y2="285" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d2630"/>
      <stop offset=".58" stop-color="#071014"/>
      <stop offset="1" stop-color="#191507"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7df4ff"/>
      <stop offset="1" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffe39b"/>
      <stop offset="1" stop-color="#ffb000"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop stop-color="#ffffff"/>
      <stop offset=".28" stop-color="#00d4ff"/>
      <stop offset=".72" stop-color="#003b4a"/>
      <stop offset="1" stop-color="#071014"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#12343d" stroke-width="1" opacity=".5"/>
    </pattern>
  </defs>

  <rect width="980" height="320" rx="22" fill="url(#bg)"/>
  <rect width="980" height="320" rx="22" fill="url(#grid)" opacity=".7"/>
  <rect class="scan" x="0" y="0" width="980" height="38" fill="#00d4ff" opacity=".08"/>

  <g opacity=".55">
    <path class="dash" d="M78 250C195 135 301 109 420 145C560 187 642 110 806 64" stroke="#00d4ff" stroke-width="2"/>
    <path class="dash" d="M109 82C240 174 361 198 490 165C640 127 743 166 886 246" stroke="#ffb000" stroke-width="2"/>
  </g>

  <g class="float">
    <path d="M200 112L490 36L780 112L490 206L200 112Z" fill="url(#panel)" stroke="#00d4ff" stroke-width="2" opacity=".96"/>
    <path d="M200 112L490 206V282L200 178V112Z" fill="#061318" stroke="#00d4ff" stroke-width="1.4" opacity=".92"/>
    <path d="M780 112L490 206V282L780 178V112Z" fill="#141205" stroke="#ffb000" stroke-width="1.4" opacity=".9"/>
    <path d="M490 206V282" stroke="#ffffff" stroke-opacity=".12"/>
  </g>

  <g class="orbit" opacity=".8">
    <ellipse cx="490" cy="164" rx="235" ry="76" stroke="#00d4ff" stroke-width="1.6" stroke-dasharray="5 12"/>
  </g>
  <g class="orbit2" opacity=".65">
    <ellipse cx="490" cy="164" rx="170" ry="115" stroke="#ffb000" stroke-width="1.4" stroke-dasharray="4 10"/>
  </g>

  <g class="glow-cyan">
    <circle cx="490" cy="158" r="55" fill="url(#core)" opacity=".95"/>
    <circle class="pulse" cx="490" cy="158" r="74" stroke="#00d4ff" stroke-width="2" opacity=".55"/>
    <circle class="pulse" cx="490" cy="158" r="92" stroke="#ffb000" stroke-width="1.5" opacity=".28"/>
  </g>

  <g transform="translate(288 111) skewY(-18)" opacity=".95">
    <rect class="bar1 glow-cyan" x="0" y="34" width="20" height="84" rx="4" fill="url(#cyan)"/>
    <rect class="bar2 glow-amber" x="36" y="5" width="20" height="113" rx="4" fill="url(#amber)"/>
    <rect class="bar3 glow-cyan" x="72" y="48" width="20" height="70" rx="4" fill="url(#cyan)"/>
    <rect class="bar4 glow-amber" x="108" y="22" width="20" height="96" rx="4" fill="url(#amber)"/>
  </g>

  <g transform="translate(600 102) skewY(18)" opacity=".95">
    <rect class="bar4 glow-cyan" x="0" y="22" width="20" height="96" rx="4" fill="url(#cyan)"/>
    <rect class="bar3 glow-amber" x="36" y="52" width="20" height="66" rx="4" fill="url(#amber)"/>
    <rect class="bar2 glow-cyan" x="72" y="8" width="20" height="110" rx="4" fill="url(#cyan)"/>
    <rect class="bar1 glow-amber" x="108" y="39" width="20" height="79" rx="4" fill="url(#amber)"/>
  </g>

  <g transform="translate(343 213) skewY(18)" opacity=".9">
    <rect class="tile" x="0" y="0" width="18" height="18" fill="#00d4ff"/>
    <rect class="tile" x="26" y="0" width="18" height="18" fill="#ffb000"/>
    <rect class="tile" x="52" y="0" width="18" height="18" fill="#00d4ff"/>
    <rect class="tile" x="78" y="0" width="18" height="18" fill="#7cff6b"/>
    <rect class="tile" x="104" y="0" width="18" height="18" fill="#00d4ff"/>
    <rect class="tile" x="130" y="0" width="18" height="18" fill="#ff4d6d"/>
    <rect class="tile" x="156" y="0" width="18" height="18" fill="#00d4ff"/>
  </g>

  <g transform="translate(375 242) skewY(18)" opacity=".85">
    <rect class="tile" x="0" y="0" width="16" height="16" fill="#ffb000"/>
    <rect class="tile" x="24" y="0" width="16" height="16" fill="#00d4ff"/>
    <rect class="tile" x="48" y="0" width="16" height="16" fill="#7cff6b"/>
    <rect class="tile" x="72" y="0" width="16" height="16" fill="#00d4ff"/>
    <rect class="tile" x="96" y="0" width="16" height="16" fill="#ffb000"/>
    <rect class="tile" x="120" y="0" width="16" height="16" fill="#00d4ff"/>
  </g>

  <g class="float2" opacity=".94">
    <rect x="62" y="58" width="180" height="92" rx="14" fill="#071014" stroke="#00d4ff" stroke-width="1.5"/>
    <text x="86" y="92" fill="#00d4ff" font-family="JetBrains Mono, Consolas, monospace" font-size="16" font-weight="700">LIVE SIGNALS</text>
    <text x="86" y="121" fill="#ffffff" font-family="JetBrains Mono, Consolas, monospace" font-size="13">commits: active</text>
    <text x="86" y="141" fill="#ffb000" font-family="JetBrains Mono, Consolas, monospace" font-size="13">builds: steady</text>
  </g>

  <g class="float" opacity=".94">
    <rect x="738" y="174" width="180" height="92" rx="14" fill="#071014" stroke="#ffb000" stroke-width="1.5"/>
    <text x="762" y="208" fill="#ffb000" font-family="JetBrains Mono, Consolas, monospace" font-size="16" font-weight="700">CONTROL ROOM</text>
    <text x="762" y="237" fill="#ffffff" font-family="JetBrains Mono, Consolas, monospace" font-size="13">repos: monitored</text>
    <text x="762" y="257" fill="#00d4ff" font-family="JetBrains Mono, Consolas, monospace" font-size="13">graph: streaming</text>
  </g>

  <text x="490" y="303" text-anchor="middle" fill="#ffffff" fill-opacity=".86" font-family="JetBrains Mono, Consolas, monospace" font-size="15" font-weight="700">
    GITHUB TELEMETRY // CONTRIBUTION MAP // BUILD VELOCITY
  </text>
</svg>
